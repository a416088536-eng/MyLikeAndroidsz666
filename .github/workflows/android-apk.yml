name: Build MyLike Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MyLikeAndroid-source-0.1.0.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Unpack project source
        run: |
          unzip -q MyLikeAndroid-source-0.1.0.zip -d unpacked
          test -f unpacked/MyLikeAndroid/settings.gradle.kts

      - name: Configure Java and Kotlin targets to 17
        working-directory: unpacked/MyLikeAndroid
        run: |
          cat > jvm-target.gradle <<'EOF'
          allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  sourceCompatibility = "17"
                  targetCompatibility = "17"
              }
          }
          EOF

      - name: Build debug APK
        working-directory: unpacked/MyLikeAndroid
        run: gradle --no-daemon -I jvm-target.gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyLike-Android-debug-APK
          path: unpacked/MyLikeAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7