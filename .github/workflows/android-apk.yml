name: Build MyLike Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MyLikeAndroid-source-0.1.0.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-provider: basic
      - name: Unpack project source
        run: |
          unzip -q MyLikeAndroid-source-0.1.0.zip -d unpacked
          test -f unpacked/MyLikeAndroid/settings.gradle.kts
      - name: Build debug APK
        working-directory: unpacked/MyLikeAndroid
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MyLike-Android-debug-APK
          path: unpacked/MyLikeAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
