name: Build MyLike Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MyLikeAndroid-source-0.1.0.zip'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Unpack project source
        run: |
          unzip -q MyLikeAndroid-source-0.1.0.zip -d unpacked
          test -f unpacked/MyLikeAndroid/settings.gradle.kts
          test -f unpacked/MyLikeAndroid/app/build.gradle.kts

      - name: Fix Java and Kotlin targets
        working-directory: unpacked/MyLikeAndroid
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = list(Path(".").rglob("*.gradle.kts"))
          for path in files:
              text = path.read_text()
              original = text
              text = text.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
              text = text.replace("JavaVersion.VERSION_1_7", "JavaVersion.VERSION_17")
              text = text.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
              text = text.replace("jvmTarget = '1.8'", "jvmTarget = '17'")
              if text != original:
                  path.write_text(text)
                  print(f"Updated: {path}")

          app_gradle = Path("app/build.gradle.kts").read_text()
          print("---- Java/Kotlin target configuration ----")
          for line in app_gradle.splitlines():
              if any(word in line for word in (
                  "sourceCompatibility",
                  "targetCompatibility",
                  "jvmTarget",
                  "VERSION_1_8",
                  "VERSION_17"
              )):
                  print(line.strip())
          PY

      - name: Build debug APK
        working-directory: unpacked/MyLikeAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyLike-Android-debug-APK
          path: unpacked/MyLikeAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7